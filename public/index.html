<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 논문 · 보고서 쉬운 해설 & 카드뉴스 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-50 min-h-screen text-slate-800">
    <!-- Header -->
    <header class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600">
            📄 PDF 논문 · 보고서 쉬운 해설 & 카드뉴스
        </h1>
        <p class="text-sm text-slate-500 mt-1">PDF 파일을 업로드하면 Gemini가 분석해 초등학생 해설과 카드뉴스를 만들어 드립니다!</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 pb-20">
        <!-- Upload Section -->
        <section class="bg-white rounded-2xl p-6 md:p-8 shadow-xl shadow-slate-100 border border-slate-100 mb-8">
            <label class="block text-sm font-semibold text-slate-700 mb-3">
                PDF 논문 또는 보고서 파일 업로드
            </label>

            <!-- Drag & Drop Upload Box -->
            <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-2xl p-8 text-center cursor-pointer transition-all bg-slate-50/50 hover:bg-indigo-50/30 flex flex-col items-center justify-center relative">
                <input type="file" id="pdfFile" accept="application/pdf,.pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl mb-3 shadow-inner">
                    📁
                </div>
                <p class="text-sm font-medium text-slate-700">여기를 클릭하거나 PDF 파일을 드래그하여 업로드하세요</p>
                <p class="text-xs text-slate-400 mt-1">지원 형식: .pdf (최대 4MB)</p>
            </div>

            <!-- 접속 코드 (서버에 ACCESS_CODE가 설정된 경우에만 표시됨) -->
            <div id="accessCodeBox" class="hidden mt-4 flex items-center bg-white border border-slate-200 rounded-xl px-3 py-2 shadow-sm focus-within:ring-2 focus-within:ring-indigo-500">
                <span class="text-xs text-slate-400 font-medium mr-2 whitespace-nowrap">접속 코드</span>
                <input type="password" id="accessCodeInput" autocomplete="off" placeholder="접속 코드를 입력하세요" class="w-full text-sm outline-none bg-transparent">
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-between mt-6 gap-3">
                <div id="fileInfo" class="text-xs text-slate-500 font-medium hidden items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="fileNameDisplay">파일명.pdf</span>
                </div>
                <div class="w-full sm:w-auto ml-auto">
                    <button id="generateBtn" type="button" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <span>✨ PDF 분석 & 카드뉴스 생성하기</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loadingIndicator" class="hidden flex-col items-center justify-center py-16">
            <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
            <p class="text-indigo-600 font-medium animate-pulse text-sm">PDF 파일을 읽고 Gemini가 분석 중입니다...</p>
        </div>

        <!-- Error Box -->
        <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl mb-6 text-sm"></div>

        <!-- Results Output Section -->
        <div id="resultSection" class="hidden space-y-8">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">🎯 분석 결과</h2>
                <button id="copyBtn" type="button" class="text-xs bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg shadow-sm font-medium transition-all">
                    📋 전체 결과 복사하기
                </button>
            </div>

            <!-- Card 1 -->
            <div class="bg-white rounded-2xl p-6 md:p-8 shadow-xl shadow-slate-100 border border-slate-100 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-2 h-full bg-amber-400"></div>
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-2xl">👧</span>
                    <h3 class="text-lg font-bold text-slate-800">초등학생도 이해하는 쉬운 말 해설</h3>
                </div>
                <div id="card1Content" class="text-slate-600 text-sm md:text-base leading-relaxed whitespace-pre-line"></div>
            </div>

            <!-- Card 2 -->
            <div class="bg-white rounded-2xl p-6 md:p-8 shadow-xl shadow-slate-100 border border-slate-100 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-2 h-full bg-emerald-500"></div>
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-2xl">📌</span>
                    <h3 class="text-lg font-bold text-slate-800">핵심 테이크어웨이 (3줄 요약)</h3>
                </div>
                <div id="card2Content" class="text-slate-600 text-sm md:text-base leading-relaxed space-y-3"></div>
            </div>

            <!-- Card 3 -->
            <div class="bg-white rounded-2xl p-6 md:p-8 shadow-xl shadow-slate-100 border border-slate-100 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-2 h-full bg-indigo-500"></div>
                <div class="flex items-center gap-3 mb-6">
                    <span class="text-2xl">📱</span>
                    <h3 class="text-lg font-bold text-slate-800">SNS 카드뉴스용 텍스트 (슬라이드 1 ~ 4)</h3>
                </div>
                <div id="card3Content" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="notification" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-medium opacity-0 transition-opacity pointer-events-none z-50"></div>

    <script src="app.js"></script>
</body>
</html>
